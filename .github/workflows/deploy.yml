name: Build & Deploy

on:
  push:
    branches: ["main", "development"]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get short commit SHA & tag prefix
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "prefix=prod" >> $GITHUB_OUTPUT
          else
            echo "prefix=dev" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lampung-dev-web:${{ steps.vars.outputs.prefix }}${{ steps.vars.outputs.short_sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/lampung-dev-web:${{ steps.vars.outputs.prefix }}-latest

      - name: Redeploy stack on Portainer
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          # Optional: only needed when Portainer sits behind Cloudflare Access
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          for v in PORTAINER_URL PORTAINER_API_KEY PORTAINER_STACK_ID PORTAINER_ENDPOINT_ID; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is not configured for the '${{ github.ref_name == 'main' && 'production' || 'development' }}' environment."
              exit 1
            fi
          done

          BASE="${PORTAINER_URL%/}/api"
          CURL_OPTS=(--silent --show-error --fail-with-body --max-time 60 -H "X-API-Key: ${PORTAINER_API_KEY}")
          if [ -n "${CF_ACCESS_CLIENT_ID:-}" ]; then
            CURL_OPTS+=(-H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}")
          fi

          # Fail early with a readable message when the response is not JSON
          # (e.g. an HTML login/proxy page instead of the Portainer API)
          api() {
            local out
            out=$(curl "${CURL_OPTS[@]}" "$@") || { echo "::error::Portainer API request failed: ${out:0:300}" >&2; exit 1; }
            if ! jq -e . >/dev/null 2>&1 <<<"$out"; then
              echo "::error::Portainer did not return JSON (check PORTAINER_URL / access policy): ${out:0:300}" >&2
              exit 1
            fi
            printf '%s' "$out"
          }

          echo "Step 1: Reading current stack file and environment variables..."
          STACK=$(api "${BASE}/stacks/${PORTAINER_STACK_ID}")
          FILE=$(api "${BASE}/stacks/${PORTAINER_STACK_ID}/file")
          echo "Stack: $(jq -r '.Name' <<<"$STACK") (status $(jq -r '.Status' <<<"$STACK"))"

          echo "Step 2: Redeploying with image re-pull (tag ${{ steps.vars.outputs.prefix }}-latest)..."
          PAYLOAD=$(jq -n \
            --argjson env "$(jq '.Env // []' <<<"$STACK")" \
            --arg file "$(jq -r '.StackFileContent' <<<"$FILE")" \
            '{stackFileContent: $file, env: $env, prune: true, pullImage: true, repullImageAndRedeploy: true}')
          api -X PUT -H "Content-Type: application/json" \
            "${BASE}/stacks/${PORTAINER_STACK_ID}?endpointId=${PORTAINER_ENDPOINT_ID}" \
            --data-binary @- <<<"$PAYLOAD" >/dev/null

          # Since Portainer 2.41 the update runs in the background:
          # Status 3 = deploying, 1 = active (done), 4 = error
          echo "Step 3: Waiting for deployment to finish..."
          for i in $(seq 1 60); do
            STACK=$(api "${BASE}/stacks/${PORTAINER_STACK_ID}")
            STATUS=$(jq -r '.Status' <<<"$STACK")
            case "$STATUS" in
              3) sleep 5 ;;
              1) echo "Deployment completed successfully."; exit 0 ;;
              4) echo "::error::Deployment failed: $(jq -r '.DeploymentStatus[-1].Message // "unknown error"' <<<"$STACK")"; exit 1 ;;
              *) echo "Stack status: $STATUS"; echo "Deployment request accepted."; exit 0 ;;
            esac
          done
          echo "::error::Timed out waiting for Portainer deployment (5 minutes)."
          exit 1
